name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q gradle-8.9-bin.zip -d /opt
          echo /opt/gradle-8.9/bin >> $GITHUB_PATH
      - name: Build
        run: |
          for z in *.zip; do [ -f $z ] && unzip -qo $z -d unpacked; done
          S=$(find . -maxdepth 4 -name settings.gradle\* | head -n1)
          if [ x$S = x ]; then echo settings.gradle not found; ls -R | head -50; exit 1; fi
          cd $(dirname $S)
          gradle —version
          gradle assembleDebug —no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            **/build/outputs/apk/debug/*.apk
